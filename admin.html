<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة تحكم — مكتب تحليل الذهب</title>
<style>
  :root {
    --bg: #0B0D10; --panel: #12151A; --panel2: #171B21; --line: #242A32;
    --gold: #C9A227; --text: #EDE9DF; --text-dim: #8E93A0; --bull: #3FA789; --bear: #D1584C;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: ui-sans-serif, system-ui, sans-serif; padding:28px 16px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-family:Georgia, serif; font-size:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  input { background:var(--panel2); border:1px solid var(--line); border-radius:6px; color:var(--text); padding:9px; font-size:13px; outline:none; }
  button { background:var(--gold); color:#0B0D10; border:none; border-radius:6px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:right; padding:8px; border-bottom:1px solid var(--line); }
  th { color:var(--text-dim); font-weight:normal; font-size:12px; }
  .badge { padding:2px 8px; border-radius:4px; font-size:11px; }
  .badge.active { background:rgba(63,167,137,0.15); color:var(--bull); }
  .badge.inactive { background:rgba(209,88,76,0.15); color:var(--bear); }
  .badge.expired { background:rgba(201,162,39,0.15); color:var(--gold); }
  select.duration-select { background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:5px; font-size:12px; }
  .activate-btn { background:var(--bull); color:#fff; padding:5px 10px; font-size:12px; border-radius:5px; }
  .deactivate-btn { background:var(--bear); color:#fff; padding:5px 10px; font-size:12px; border-radius:5px; margin-inline-start:4px; }
  .notes-input { width:130px; font-size:12px; }
  .limit-input { background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:5px; font-size:12px; }
  .err { color:var(--bear); font-size:13px; }
  #loginBox { max-width:340px; margin:80px auto; text-align:center; }
  #loginBox input { width:100%; margin-bottom:10px; }
  #loginBox button { width:100%; }
</style>
</head>
<body>

<div id="loginBox">
  <h1>🔐 دخول لوحة التحكم</h1>
  <input type="password" id="secretInput" placeholder="كلمة السر الإدارية" />
  <button id="loginBtn">دخول</button>
  <div class="err" id="loginErr"></div>
</div>

<div class="wrap" id="dashboard" style="display:none;">
  <h1>لوحة تحكم المشتركين</h1>

  <div class="card">
    <h3 style="margin-top:0; font-size:14px;">⚙️ إعدادات عامة</h3>
    <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end;">
      <div>
        <label style="display:block; font-size:11px; color:var(--text-dim); margin-bottom:4px;">الحد اليومي الافتراضي (لكل المستخدمين)</label>
        <input type="number" id="defaultLimitInput" min="1" style="width:100px;" />
      </div>
      <div style="flex:1; min-width:220px;">
        <label style="display:block; font-size:11px; color:var(--text-dim); margin-bottom:4px;">نسبة النجاح المعروضة بالصفحة الرئيسية</label>
        <input type="text" id="accuracyTextInput" style="width:100%;" placeholder="مثلاً: 78% خلال آخر شهرين" />
      </div>
      <button id="saveSettingsBtn">حفظ الإعدادات</button>
    </div>
    <div class="err" id="settingsMsg" style="margin-top:8px;"></div>
  </div>

  <div class="card">
    <button id="refreshBtn">🔄 تحديث القائمة</button>
    <span id="countLabel" style="margin-inline-start:12px; color:var(--text-dim); font-size:13px;"></span>
  </div>
  <div class="card">
    <table>
      <thead>
        <tr><th>البريد</th><th>الحالة</th><th>ينتهي بتاريخ</th><th>الحد اليومي</th><th>ملاحظات</th><th>إجراء</th></tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</div>

<script>
let ADMIN_SECRET = "";

function headers() {
  return { "Content-Type": "application/json", "x-admin-secret": ADMIN_SECRET };
}

document.getElementById("loginBtn").onclick = async () => {
  ADMIN_SECRET = document.getElementById("secretInput").value.trim();
  const ok = await loadUsers();
  if (ok) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    sessionStorage.setItem("admin_secret", ADMIN_SECRET);
    loadSettings();
  }
};

document.getElementById("refreshBtn").onclick = loadUsers;

async function loadSettings() {
  try {
    const r = await fetch("/api/admin-settings", { headers: headers() });
    const data = await r.json();
    if (r.ok) {
      document.getElementById("defaultLimitInput").value = data.default_daily_limit;
      document.getElementById("accuracyTextInput").value = data.public_accuracy_text;
    }
  } catch (e) {}
}

document.getElementById("saveSettingsBtn").onclick = async () => {
  const msg = document.getElementById("settingsMsg");
  msg.textContent = "جارٍ الحفظ...";
  msg.style.color = "var(--text-dim)";
  try {
    const r = await fetch("/api/admin-settings", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        default_daily_limit: Number(document.getElementById("defaultLimitInput").value) || 5,
        public_accuracy_text: document.getElementById("accuracyTextInput").value,
      }),
    });
    if (r.ok) { msg.textContent = "✓ تم الحفظ"; msg.style.color = "var(--bull)"; }
    else { msg.textContent = "فشل الحفظ"; msg.style.color = "var(--bear)"; }
  } catch (e) { msg.textContent = "خطأ بالاتصال"; msg.style.color = "var(--bear)"; }
};

async function loadUsers() {
  document.getElementById("loginErr").textContent = "";
  try {
    const r = await fetch("/api/admin-list-users", { headers: headers() });
    const data = await r.json();
    if (!r.ok) { document.getElementById("loginErr").textContent = data.error || "خطأ"; return false; }
    renderUsers(data.users || []);
    return true;
  } catch (e) {
    document.getElementById("loginErr").textContent = "خطأ بالاتصال.";
    return false;
  }
}

function renderUsers(users) {
  document.getElementById("countLabel").textContent = `${users.length} مستخدم`;
  const body = document.getElementById("usersBody");
  body.innerHTML = "";
  const now = Date.now();

  users.forEach(u => {
    const tr = document.createElement("tr");
    const expiresAt = u.subscription_expires_at ? new Date(u.subscription_expires_at) : null;
    const isExpired = expiresAt ? expiresAt.getTime() <= now : false;
    const effectivelyActive = u.is_active && !isExpired;

    let badgeClass = "inactive", badgeText = "غير مفعّل";
    if (effectivelyActive) { badgeClass = "active"; badgeText = "مفعّل"; }
    else if (u.is_active && isExpired) { badgeClass = "expired"; badgeText = "منتهي"; }

    const expiryText = expiresAt
      ? expiresAt.toLocaleDateString("ar-EG", { year:"numeric", month:"short", day:"numeric" })
      : "—";

    tr.innerHTML = `
      <td>${u.email || ""}</td>
      <td><span class="badge ${badgeClass}">${badgeText}</span></td>
      <td>${expiryText}</td>
      <td><input type="number" min="0" class="limit-input" data-id="${u.id}" value="${u.daily_limit_override ?? ""}" placeholder="افتراضي" style="width:70px;" /></td>
      <td><input class="notes-input" data-id="${u.id}" value="${u.notes || ""}" placeholder="ملاحظة" /></td>
      <td>
        <select class="duration-select" data-id="${u.id}">
          <option value="7">أسبوع</option>
          <option value="30" selected>شهر</option>
          <option value="60">شهرين</option>
          <option value="90">3 أشهر</option>
          <option value="180">6 أشهر</option>
          <option value="365">سنة</option>
        </select>
        <button class="activate-btn" data-id="${u.id}">تفعيل/تجديد</button>
        <button class="deactivate-btn" data-id="${u.id}">إيقاف الآن</button>
      </td>
    `;
    body.appendChild(tr);
  });

  body.querySelectorAll(".activate-btn").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const select = body.querySelector(`.duration-select[data-id="${id}"]`);
      const notesInput = body.querySelector(`.notes-input[data-id="${id}"]`);
      const extend = confirm("اضغط OK للتمديد من تاريخ انتهاء الاشتراك الحالي (لو لسا فعّال)، أو Cancel لبدء المدة من اليوم.");
      await fetch("/api/admin-set-active", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({
          id,
          duration_days: Number(select.value),
          extend_from_current: extend,
          notes: notesInput.value,
        }),
      });
      loadUsers();
    };
  });

  body.querySelectorAll(".deactivate-btn").forEach(btn => {
    btn.onclick = async () => {
      await fetch("/api/admin-set-active", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ id: btn.dataset.id, is_active: false }),
      });
      loadUsers();
    };
  });

  body.querySelectorAll(".limit-input").forEach(inp => {
    inp.onblur = async () => {
      const v = inp.value.trim();
      await fetch("/api/admin-set-active", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ id: inp.dataset.id, daily_limit_override: v === "" ? null : Number(v) }),
      });
    };
  });

  body.querySelectorAll(".notes-input").forEach(inp => {
    inp.onblur = async () => {
      await fetch("/api/admin-set-active", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ id: inp.dataset.id, notes: inp.value }),
      });
    };
  });
}

// استرجاع الجلسة من هالمتصفح لو موجودة (بدون تخزين دائم)
const saved = sessionStorage.getItem("admin_secret");
if (saved) {
  ADMIN_SECRET = saved;
  loadUsers().then(ok => {
    if (ok) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      loadSettings();
    }
  });
}
</script>
</body>
</html>
